<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Sistema de Ventas</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="fondo-login">
    <main class="contenedor-login">
        <section class="tarjeta-login">
            <img src="img/logo.svg" alt="Logo Sistema de Ventas" class="logo-login">
            <h1>Sistema de Ventas</h1>
            <p class="subtitulo">Ingrese sus credenciales para continuar</p>

            <form id="form-login" novalidate>
                <div class="campo">
                    <label for="usuario">Usuario o Correo Electrónico</label>
                    <input type="text" id="usuario" placeholder="Ej: admin o admin@ventas.com" required>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingrese su contraseña" required>
                </div>

                <p id="mensaje-error" class="error-oculto" role="alert"></p>

                <button type="submit" class="btn-primario btn-bloque">Ingresar</button>
            </form>
        </section>
    </main>

    <footer class="footer-login">
        <p>&copy; 2026 Sistema de Ventas - Diseño y Programación Web I</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
